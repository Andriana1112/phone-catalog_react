<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#f5f5dc"/>
  
  <!-- Wine bottles -->
  <rect x="50" y="80" width="40" height="150" fill="#2c1810" stroke="#1a0f08" stroke-width="1"/>
  <rect x="120" y="60" width="40" height="170" fill="#2c1810" stroke="#1a0f08" stroke-width="1"/>
  <rect x="190" y="70" width="40" height="160" fill="#2c1810" stroke="#1a0f08" stroke-width="1"/>
  <rect x="260" y="90" width="40" height="140" fill="#2c1810" stroke="#1a0f08" stroke-width="1"/>
  
  <!-- Wine inside bottles -->
  <rect x="55" y="100" width="30" height="120" fill="#fff8dc" opacity="0.9"/>
  <rect x="125" y="80" width="30" height="140" fill="#fff8dc" opacity="0.9"/>
  <rect x="195" y="90" width="30" height="130" fill="#fff8dc" opacity="0.9"/>
  <rect x="265" y="110" width="30" height="110" fill="#fff8dc" opacity="0.9"/>
  
  <!-- Title -->
  <text x="200" y="40" text-anchor="middle" font-family="serif" font-size="24" fill="#2c1810" font-weight="bold">White Wines</text>
  
  <!-- Subtitle -->
  <text x="200" y="260" text-anchor="middle" font-family="serif" font-size="14" fill="#2c1810">Crisp & Refreshing</text>
</svg>
