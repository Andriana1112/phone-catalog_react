<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="600" fill="#f8f9fa"/>
  
  <!-- Wine bottle -->
  <rect x="150" y="100" width="100" height="400" fill="#2c1810" stroke="#1a0f08" stroke-width="2"/>
  
  <!-- Bottle neck -->
  <rect x="170" y="80" width="60" height="30" fill="#2c1810" stroke="#1a0f08" stroke-width="2"/>
  
  <!-- Cork -->
  <rect x="180" y="60" width="40" height="25" fill="#8b4513" stroke="#654321" stroke-width="1"/>
  
  <!-- Wine label -->
  <rect x="160" y="200" width="80" height="120" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  
  <!-- Label text -->
  <text x="200" y="230" text-anchor="middle" font-family="serif" font-size="12" fill="#2c1810">Riesling</text>
  <text x="200" y="250" text-anchor="middle" font-family="serif" font-size="10" fill="#666666">Mosel</text>
  <text x="200" y="270" text-anchor="middle" font-family="serif" font-size="8" fill="#666666">Mosel</text>
  <text x="200" y="290" text-anchor="middle" font-family="serif" font-size="8" fill="#666666">Germany</text>
  
  <!-- Wine inside bottle -->
  <rect x="155" y="300" width="90" height="180" fill="#f0f8ff" opacity="0.8"/>
  
  <!-- Wine level -->
  <rect x="155" y="300" width="90" height="150" fill="#e6f3ff" opacity="0.9"/>
  
  <!-- Bottle base -->
  <ellipse cx="200" cy="520" rx="50" ry="15" fill="#1a0f08"/>
  
  <!-- Reflection -->
  <rect x="160" y="120" width="20" height="350" fill="#ffffff" opacity="0.1"/>
</svg>
